[project]
name = "health-service"
version = "0.1.0"
description = "Health service backend"
requires-python = ">=3.13,<3.14"
dependencies = [
    "Django>=5.2,<5.3",
    "asgiref>=3.8,<4",
    "django-ninja>=1.3,<2",
    "django-ninja-extra>=0.30,<1",
    "django-ninja-jwt>=5.4.5,<6",
    "health-inference",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
    "redis>=5.2,<7",
    "uvicorn>=0.34,<1",
]

[tool.uv.sources]
health-inference = { workspace = true }

[tool.uv.build-backend]
module-name = ["health_service", "config"]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"
