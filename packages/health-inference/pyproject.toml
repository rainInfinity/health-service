[project]
name = "health-inference"
version = "0.1.0"
description = "Health inference algorithms"
requires-python = ">=3.13,<3.14"

dependencies = [
    "numpy==2.3.5",
    "pandas==2.3.3",
]

[project.optional-dependencies]
ppg = [
    "neurokit2==0.2.12",
    "scipy==1.16.3",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"
