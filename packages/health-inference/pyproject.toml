[project]
name = "health-inference"
version = "0.1.0"
description = "Health inference algorithms"
requires-python = ">=3.13,<3.14"

dependencies = [
    "numpy==2.3.5",
    "pandas==2.3.3",
]

[project.optional-dependencies]
ppg = [
    "dotmap==1.3.30",
    "neurokit2==0.2.12",
    "onnxruntime==1.23.2",
    "scikit-learn==1.9.1",
    "scipy==1.16.3",
    "joblib>=1.5.3,<2",
    "pygam==0.12.0",
    "vmdpy==0.2",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"
