
[project]
name = "health-service"
version = "0.1.0"
description = "Health service backend"
requires-python = ">=3.13,<3.14"
dependencies = [
    "Django>=5.2,<5.3",
    "django-ninja>=1.3,<2",
    "django-ninja-extra>=0.30,<1",
    "django-ninja-jwt>=5.4.5,<6",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-django>=4.11,<5",
    "ruff>=0.11,<1",
]
[tool.uv]
package = false


[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["src"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
